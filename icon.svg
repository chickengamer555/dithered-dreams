<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <!-- Simple gradient background -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a148c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a237e;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="64" cy="64" r="60" fill="url(#bg)" />
  
  <!-- Dream/sleep icon - crescent moon -->
  <path d="M 50 30 Q 40 40, 40 64 Q 40 88, 50 98 Q 35 93, 25 78 Q 15 63, 25 48 Q 35 33, 50 30 Z" 
        fill="#ffd700" opacity="0.9"/>
  
  <!-- Stars -->
  <circle cx="75" cy="35" r="3" fill="#ffffff" opacity="0.8"/>
  <circle cx="90" cy="50" r="2" fill="#ffffff" opacity="0.7"/>
  <circle cx="85" cy="70" r="2.5" fill="#ffffff" opacity="0.8"/>
  <circle cx="95" cy="85" r="2" fill="#ffffff" opacity="0.7"/>
</svg>

